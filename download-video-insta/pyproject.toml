[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-reel-downloader"
version = "0.1.0"
description = "CLI для скачивания публичных Instagram Reels"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "yt-dlp>=2025.1.15",
]

[project.scripts]
download-reel = "download_reel:main"

[tool.setuptools]
py-modules = ["download_reel"]
