[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-shorts-downloader"
version = "0.1.0"
description = "CLI для скачивания публичных YouTube Shorts"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "yt-dlp[default]>=2025.11.12",
]

[project.scripts]
download-short = "download_short:main"

[tool.setuptools]
py-modules = ["download_short"]
