[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-video-downloader"
version = "0.1.0"
description = "Скачивание видео из социальных сетей с определением источника по ссылке"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9", "yt-dlp[default]>=2025.11.12"]

[project.scripts]
short-video-download = "download_video:main"

[tool.setuptools]
py-modules = ["download_video"]
